name: Build and release

on:
  push:
    branches: [ ci ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
            base: "ubuntu:jammy"
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            base: "ubuntu:jammy"
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            arch: rpi3
            base: "debian:bullseye-slim"
            runner: ubuntu-latest
          - platform: linux/arm/v7
            arch: rpi2
            base: "debian:bullseye-slim"
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: rlespinasse/github-slug-action@v4

      - name: Setup qemu for docker
        uses: docker/setup-qemu-action@v3
        if: matrix.platform != 'linux/amd64'

      - name: Setup buildx for docker
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: build
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            TARGET_PLATFORM=${{ matrix.platform }}
            LR_PLATFORM=${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.arch }}
          path: |
            build/lr_multi_bomberman_libretro.so
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: assets
      - uses: rlespinasse/github-slug-action@v5
      - name: Package artifacts
        shell: bash
        run: |
          find assets -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | while read arch; do
            (pushd "assets/${arch}"; tar c --remove-files -zvf "../lr-multi-bomberman-${GITHUB_REF_NAME_SLUG}-${arch}.tar.gz" *; popd)
          done
      - name: Create checksum for release assets
        shell: bash
        run: |
          algo="${SHA_ALGORITHM:-256}"
          find assets -type f | while read -r asset; do
            shasum --binary --algorithm "${algo}" "${asset}" >"${asset}.sha${algo}"
          done
      - name: Upload artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: assets/**
